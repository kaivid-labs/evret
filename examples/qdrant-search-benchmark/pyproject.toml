[project]
name = "evret-qdrant-search-benchmark"
version = "0.1.0"
description = "Benchmark Qdrant search techniques (dense, BM25, hybrid RRF, ColBERT rerank) with evret IR metrics"
requires-python = ">=3.10"
dependencies = [
  "evret[qdrant,llm-openai]",
  "qdrant-client>=1.12.0",
  "fastembed>=0.4.0",
  "pypdfium2>=4.0.0",
  "python-dotenv>=1.0.0",
]

# Resolve `evret` from the repo root so the example runs against local source.
[tool.uv.sources]
evret = { path = "../..", editable = true }
